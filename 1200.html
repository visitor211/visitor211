<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中小 1200 單字情境拼字測驗館</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --secondary: #0ea5e9;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-inner {
      max-width: 1050px;
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: inherit;
    }
    .brand-logo {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
    }
    .brand-title h1 { font-size: 1.05rem; font-weight: 800; }
    .brand-title p { font-size: 0.75rem; color: var(--text-muted); }
    
    .btn-header {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.45rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-header:hover {
      background: var(--primary-light);
      border-color: #c7d2fe;
      color: var(--primary);
    }

    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 1.5rem auto;
      padding: 0 1.25rem;
    }

    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .player-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .player-input-wrap { flex: 1; }
    .player-input-wrap label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }
    .player-input-wrap input {
      width: 100%; border: none; outline: none; font-size: 1rem;
      font-weight: 700; color: var(--text-main); background: transparent;
      border-bottom: 2px solid transparent; transition: border-color 0.2s;
    }
    .player-input-wrap input:focus { border-bottom-color: var(--primary); }

    .comprehensive-banner {
      background: linear-gradient(135deg, #3730a3, #4f46e5);
      color: white; border-radius: var(--radius-lg); padding: 1.5rem;
      margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
    }
    .banner-title h2 { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.25rem; }
    .banner-title p { font-size: 0.85rem; color: #e0e7ff; }
    
    .btn-quiz-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn-count-opt {
      background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3);
      color: white; padding: 0.5rem 1.1rem; border-radius: 9999px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.15s ease;
    }
    .btn-count-opt:hover { background: white; color: var(--primary); }

    .section-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 0.85rem; }
    
    /* 優化：調整最小寬度避免小螢幕破版 */
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }
    .unit-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 1rem 1.1rem;
      display: flex; flex-direction: column; justify-content: space-between; gap: 0.75rem;
    }
    .unit-header-wrap { display: flex; align-items: center; justify-content: space-between; }
    .unit-tag { font-size: 0.75rem; font-weight: 700; background: var(--primary-light); color: var(--primary); padding: 2px 6px; border-radius: 4px; }
    .unit-range-text { font-size: 0.75rem; color: var(--text-muted); }
    .unit-title-text { font-size: 1rem; font-weight: 700; }
    .unit-count-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.35rem; }
    
    .btn-unit-opt {
      background: #f1f5f9; border: 1px solid #e2e8f0; color: var(--text-main);
      padding: 0.4rem 0; border-radius: 6px; font-size: 0.8rem; font-weight: 700;
      cursor: pointer; text-align: center; transition: all 0.15s ease;
    }
    .btn-unit-opt:hover { background: var(--primary); border-color: var(--primary); color: white; }

    /* 補全：測驗進行中與結束介面樣式 */
    .quiz-card { padding: 2rem 1.5rem; margin-top: 1rem; text-align: center; }
    .quiz-status-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; font-size: 0.85rem; font-weight: 700; }
    .badge-streak { background: #ffedd5; color: #ea580c; padding: 3px 8px; border-radius: 9999px; }
    .badge-score { background: #fef3c7; color: #b45309; padding: 3px 8px; border-radius: 9999px; }
    
    .progress-bar-wrap { width: 100%; height: 7px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; margin-bottom: 1.5rem; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); width: 0%; transition: width 0.25s ease; }
    
    .word-prompt-box { margin: 2rem 0; }
    .word-chinese { font-size: 1.5rem; font-weight: 900; margin-bottom: 0.5rem; color: var(--text-main); }
    .word-sentence { font-size: 1rem; color: var(--text-muted); font-style: italic; }
    
    .quiz-form { max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
    .input-spell {
      width: 100%; padding: 0.75rem; border: 2px solid var(--border); border-radius: var(--radius-md);
      font-size: 1.25rem; text-align: center; font-weight: bold; letter-spacing: 1px;
    }
    .input-spell:focus { border-color: var(--primary); outline: none; }
    
    .btn-submit {
      background: var(--primary); color: white; border: none; padding: 0.75rem;
      border-radius: var(--radius-md); font-weight: 700; font-size: 1rem; cursor: pointer;
    }
    .btn-submit:hover { background: var(--primary-hover); }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="#" class="brand" id="btn-home">
        <div class="brand-logo">A</div>
        <div class="brand-title">
          <h1>1200 單字情境拼字測驗館</h1>
          <p>國中小必備核心字彙</p>
        </div>
      </a>
      <div class="header-actions">
        <button class="btn-header" id="btn-nav-home">返回首頁</button>
      </div>
    </div>
  </header>

  <main>
    <!-- 視圖 1：大廳主頁面 -->
    <section id="view-lobby" class="view-section active">
      <div class="player-box">
        <div class="player-box-left">
          <div class="player-avatar">🎮</div>
          <div class="player-input-wrap">
            <label for="player-name">挑戰者暱稱</label>
            <input type="text" id="player-name" value="Player_1">
          </div>
        </div>
      </div>

      <div class="comprehensive-banner">
        <div class="banner-title">
          <h2>全冊隨機綜合挑戰</h2>
          <p>從 1200 個單字中隨機抽選進行測驗，挑戰你的最高極限！</p>
        </div>
        <div class="btn-quiz-group" id="lobby-random-actions">
          <button class="btn-count-opt" data-type="random" data-words="10">挑戰 10 題</button>
          <button class="btn-count-opt" data-type="random" data-words="20">挑戰 20 題</button>
          <button class="btn-count-opt" data-type="random" data-words="50">挑戰 50 題</button>
        </div>
      </div>

      <h2 class="section-title">分單元突破關卡</h2>
      <!-- 優化：使用事件代理處理內部所有按鈕 -->
      <div class="unit-grid" id="unit-grid-container">
        <!-- 範例單元 1 -->
        <div class="unit-card">
          <div class="unit-header-wrap">
            <span class="unit-tag">Unit 1</span>
            <span class="unit-range-text">001 - 040</span>
          </div>
          <div class="unit-title-text">日常生活與家庭</div>
          <div class="unit-count-btns">
            <button class="btn-unit-opt" data-unit="1" data-words="10">10題</button>
            <button class="btn-unit-opt" data-unit="1" data-words="20">20題</button>
            <button class="btn-unit-opt" data-unit="1" data-words="40">全部</button>
          </div>
        </div>
        <!-- 範例單元 2 -->
        <div class="unit-card">
